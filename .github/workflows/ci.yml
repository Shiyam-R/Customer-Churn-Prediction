name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app/ --output-format=github

      - name: Run test suite
        run: pytest tests/ -v

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t churn-api:ci-test .

      - name: Verify container starts and /health, /version respond
        run: |
          docker run -d -p 8000:8000 --name churn-api-test churn-api:ci-test
          sleep 8
          docker logs churn-api-test
          curl --fail http://127.0.0.1:8000/health || (docker logs churn-api-test && exit 1)
          curl --fail http://127.0.0.1:8000/version || (docker logs churn-api-test && exit 1)
          docker stop churn-api-test

  publish-and-deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-audit, docker-build]
    # CD only fires on an actual push to main — never on pull requests,
    # matching the trigger scope declared at the top of this file.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        # GHCR requires lowercase paths; github.repository can be mixed case.
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render deploy
        # Requires a RENDER_DEPLOY_HOOK_URL repo secret (Render dashboard ->
        # service -> Settings -> Deploy Hook). continue-on-error so this
        # doesn't block the pipeline before Render is actually connected —
        # but the step still shows failed/skipped clearly in the Actions log.
        continue-on-error: true
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
