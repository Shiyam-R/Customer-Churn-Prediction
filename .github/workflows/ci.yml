name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app/ --output-format=github

      - name: Smoke test — app imports and /health responds
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              resp = client.get('/health')
              assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
              assert resp.json()['model_loaded'] is True, 'Model did not load at startup'
              print('Smoke test passed:', resp.json())
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-api:ci-test .

      - name: Verify container starts and /health responds
        run: |
          docker run -d -p 8000:8000 --name churn-api-test churn-api:ci-test
          sleep 8
          docker logs churn-api-test
          curl --fail http://127.0.0.1:8000/health || (docker logs churn-api-test && exit 1)
          docker stop churn-api-test
